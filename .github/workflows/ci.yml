name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  a11y-checks:
    name: Accessibility Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes jsx-a11y)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit + a11y tests (axe-core)
        run: npm test

      - name: Build
        run: npm run build

      - name: Size budget
        run: npm run size

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for e2e
        run: npm run build

      - name: Run e2e a11y tests
        run: npm run test:e2e
        env:
          CI: true